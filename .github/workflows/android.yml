name: Build Android APK
on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unpack uploaded ZIP archive
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project Root and Build APK
      run: |
        # Ищем папку, где лежит settings.gradle или build.gradle
        BUILD_DIR=$(find . -maxdepth 3 -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
        
        if [ -z "$BUILD_DIR" ]; then
          echo "Файлы Gradle не найдены!"
          exit 1
        fi
        
        echo "Проект найден в папке: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        chmod +x gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk

